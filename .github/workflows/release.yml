name: release
# Push a tag like v1.0.0 (or run manually) to publish MixtapeCD-windows.zip as a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true
permissions:
  contents: write
env:
  AVALONIA_TELEMETRY_OPTOUT: 1
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build MixtapeCD.exe
        run: |
          dotnet publish src/MixtapeCd.App -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -o MixtapeCD
          rm -f MixtapeCD/*.pdb
      - name: Bundle ffmpeg and licenses
        run: |
          curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q -j ffmpeg.zip '*/bin/ffmpeg.exe' '*/LICENSE.txt' -d MixtapeCD
          mv MixtapeCD/LICENSE.txt MixtapeCD/FFMPEG-LICENSE.txt
          cp README.md LICENSE LICENSE-NOTICE.md THIRD-PARTY-NOTICES.txt MixtapeCD/
          zip -qr -9 MixtapeCD-windows.zip MixtapeCD
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Mixtape CD ${{ inputs.tag || github.ref_name }}
          files: MixtapeCD-windows.zip
          body: |
            **Windows:** download `MixtapeCD-windows.zip`, unzip, run `MixtapeCD.exe`.
            Includes ffmpeg (any audio file works). Burn with [ImgBurn](https://www.imgburn.com/).
            If SmartScreen warns (the app isn't code-signed): More info → Run anyway.
