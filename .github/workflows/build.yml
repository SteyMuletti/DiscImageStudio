name: build
on:
  push:
  workflow_dispatch:
env:
  AVALONIA_TELEMETRY_OPTOUT: 1
jobs:
  app-windows:
    name: MixtapeCD app (Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish MixtapeCD.exe
        run: |
          dotnet publish src/MixtapeCd.App -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -o out
          rm -f out/*.pdb
      - name: Bundle ffmpeg (reads MP3/FLAC/M4A)
        run: |
          curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q -j ffmpeg.zip '*/bin/ffmpeg.exe' '*/LICENSE.txt' -d out
          mv out/LICENSE.txt out/FFMPEG-LICENSE.txt
          cp README.md LICENSE LICENSE-NOTICE.md THIRD-PARTY-NOTICES.txt out/
      - uses: actions/upload-artifact@v4
        with:
          name: MixtapeCD-windows
          path: out

  cli:
    name: mixtape-cd command line (${{ matrix.rid }})
    strategy:
      matrix:
        rid: [win-x64, osx-arm64, linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish single-file mixtape-cd
        run: |
          dotnet publish src/DiscImageStudio.Cli -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
          cp -r art tools make-mixtape.ps1 make-mixtape.sh README.md LICENSE LICENSE-NOTICE.md THIRD-PARTY-NOTICES.txt out/
          rm -f out/*.pdb
      - uses: actions/upload-artifact@v4
        with:
          name: mixtape-cd-cli-${{ matrix.rid }}
          path: out
