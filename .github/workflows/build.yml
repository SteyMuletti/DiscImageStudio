name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        rid: [win-x64, osx-arm64, linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish single-file mixtape-cd (${{ matrix.rid }})
        run: |
          dotnet publish src/DiscImageStudio.Cli -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
          cp -r art tools make-mixtape.ps1 make-mixtape.sh README.md LICENSE LICENSE-NOTICE.md THIRD-PARTY-NOTICES.txt out/
          rm -f out/*.pdb
      - uses: actions/upload-artifact@v4
        with:
          name: mixtape-cd-${{ matrix.rid }}
          path: out
